# golangci-lint v2 configuration.
version: "2"

linters:
  settings:
    errcheck:
      # go-kit/log's Logger.Log returns an error that, per the library's own
      # design, callers are not expected to handle.
      exclude-functions:
        - (github.com/go-kit/log.Logger).Log
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
